name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        run: sudo apt-get install -y musl-tools

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            api/target
          key: cargo-${{ matrix.target }}-${{ hashFiles('api/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-

      - name: Build API binary
        working-directory: api
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run tests
        working-directory: api
        run: cargo test

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cartridge-api-${{ matrix.arch }}
          path: api/target/${{ matrix.target }}/release/cartridge-api

  build-image:
    needs: build-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download API binary
        uses: actions/download-artifact@v4
        with:
          name: cartridge-api-amd64
          path: api/bin/linux-amd64/

      - name: Make binary executable
        run: chmod +x api/bin/linux-amd64/cartridge-api

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cartridge:test
          build-args: CARTRIDGE_API_PREBUILT=1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm -d --name cart-ci \
            --shm-size 2g --cap-add SYS_ADMIN --security-opt seccomp=unconfined \
            cartridge:test

          for i in $(seq 1 30); do
            docker logs cart-ci 2>&1 | grep -qF "[bootstrap] ready" && break
            sleep 1
          done

          # API health
          docker exec cart-ci curl -sf http://localhost:4500/api/health

          # Existing checks
          docker exec cart-ci bash -c '
            export NVM_DIR=/usr/local/nvm; . "$NVM_DIR/nvm.sh"
            echo "node: $(node --version)"
            echo "claude: $(claude --version 2>&1 | head -1)"
            echo "pi: $(pi --version 2>&1)"
            curl -sf http://localhost:7681 > /dev/null && echo "ttyd: ok"
            curl -sf http://localhost:9222/json/version > /dev/null && echo "cdp: ok"
            curl -sf http://localhost:4500/api/health > /dev/null && echo "api: ok"
          '

          docker stop cart-ci

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          ignore: DL3008,DL3013,DL3016,DL3059,SC2086
