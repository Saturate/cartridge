name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cartridge:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm -d --name cart-ci \
            --shm-size 2g --cap-add SYS_ADMIN --security-opt seccomp=unconfined \
            cartridge:test

          # Wait for bootstrap
          for i in $(seq 1 30); do
            docker logs cart-ci 2>&1 | grep -qF "[bootstrap] ready" && break
            sleep 1
          done

          # Verify key services and tools
          docker exec cart-ci bash -c '
            export NVM_DIR=/usr/local/nvm; . "$NVM_DIR/nvm.sh"
            echo "node: $(node --version)"
            echo "claude: $(claude --version 2>&1 | head -1)"
            echo "pi: $(pi --version 2>&1)"
            curl -sf http://localhost:7681 > /dev/null && echo "ttyd: ok"
            curl -sf http://localhost:9222/json/version > /dev/null && echo "cdp: ok"
          '

          docker stop cart-ci

  lint-dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          ignore: DL3008,DL3013,DL3016,DL3059,SC2086
