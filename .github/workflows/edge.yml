name: Edge

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            mkdir -p ~/.cargo
            cat >> ~/.cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-musl]
          linker = "aarch64-linux-gnu-gcc"
          rustflags = ["-C", "link-self-contained=yes", "-C", "linker-flavor=gcc"]
          EOF
          fi

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            api/target
          key: cargo-${{ matrix.target }}-${{ hashFiles('api/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-

      - name: Build API binary
        working-directory: api
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cartridge-${{ matrix.arch }}
          path: api/target/${{ matrix.target }}/release/cartridge

  edge:
    needs: build-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: cartridge-amd64
          path: api/bin/linux-amd64/

      - name: Download arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: cartridge-arm64
          path: api/bin/linux-arm64/

      - name: Make binaries executable
        run: chmod +x api/bin/linux-*/cartridge

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push :edge
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/saturate/cartridge:edge
            ghcr.io/saturate/cartridge:main-${{ github.sha }}
          build-args: CARTRIDGE_API_PREBUILT=1
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/Saturate/cartridge
