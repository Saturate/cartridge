{{- $hasSecrets := or .Values.providers.anthropicApiKey .Values.providers.openaiApiKey .Values.providers.geminiApiKey .Values.providers.ghToken .Values.tunnels.tailscale.authkey .Values.tunnels.cloudflare.tunnelToken .Values.notifications.shoutrrrUrl .Values.husk.apiKey .Values.api.token }}
{{- if $hasSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cartridge.fullname" . }}-secrets
  labels:
    {{- include "cartridge.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.providers.anthropicApiKey }}
  anthropic-api-key: {{ .Values.providers.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.providers.openaiApiKey }}
  openai-api-key: {{ .Values.providers.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.providers.geminiApiKey }}
  gemini-api-key: {{ .Values.providers.geminiApiKey | quote }}
  {{- end }}
  {{- if .Values.providers.ghToken }}
  gh-token: {{ .Values.providers.ghToken | quote }}
  {{- end }}
  {{- if .Values.tunnels.tailscale.authkey }}
  tailscale-authkey: {{ .Values.tunnels.tailscale.authkey | quote }}
  {{- end }}
  {{- if .Values.tunnels.cloudflare.tunnelToken }}
  cf-tunnel-token: {{ .Values.tunnels.cloudflare.tunnelToken | quote }}
  {{- end }}
  {{- if .Values.notifications.shoutrrrUrl }}
  shoutrrr-url: {{ .Values.notifications.shoutrrrUrl | quote }}
  {{- end }}
  {{- if .Values.husk.apiKey }}
  husk-api-key: {{ .Values.husk.apiKey | quote }}
  {{- end }}
  {{- if .Values.api.token }}
  api-token: {{ .Values.api.token | quote }}
  {{- end }}
{{- end }}
